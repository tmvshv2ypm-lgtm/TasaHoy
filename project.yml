name: TasaHoy
options:
  bundleIdPrefix: com.tasahoy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  TasaHoy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TasaHoy
        excludes:
          - Resources/Info.plist
          - Resources/TasaHoy.entitlements
    info:
      path: TasaHoy/Resources/Info.plist
    entitlements:
      path: TasaHoy/Resources/TasaHoy.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tasahoy.app
        PRODUCT_NAME: TasaHoy
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: TasaHoy/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TasaHoy/Resources/TasaHoy.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
